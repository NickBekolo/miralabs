name: CI — Miralabs Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: miralabs_test
          POSTGRES_USER: miralabs
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, intl
          coverage: xdebug

      - name: Install dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist

      - name: Generate JWT keys
        working-directory: ./backend
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem

      - name: Run migrations test env
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://miralabs:secret@localhost:5432/miralabs_test
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://miralabs:secret@localhost:5432/miralabs_test
        run: php bin/phpunit --coverage-text --colors=never
