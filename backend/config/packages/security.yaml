security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        # Public — auth et sélection établissement
        - { path: ^/api/auth,                                roles: PUBLIC_ACCESS }
        - { path: ^/api/public,                              roles: PUBLIC_ACCESS }
        - { path: ^/api/platform/etablissements/public, roles: PUBLIC_ACCESS }

        # Éditeur Miralabs (tous les établissements)
        - { path: ^/api/platform,                            roles: ROLE_SUPER_ADMIN_PLATEFORME }

        # Super Admin (son établissement uniquement)
        - { path: ^/api/admin,                               roles: ROLE_ADMIN }

        # Direction
        - { path: ^/api/directeur,                           roles: ROLE_DIRECTEUR }

        # Service pédagogique
        - { path: ^/api/pedagogique,                         roles: ROLE_SERVICE_PEDAGOGIQUE }

        # CPE
        - { path: ^/api/cpe,                                 roles: ROLE_CPE }

        # Secrétariat
        - { path: ^/api/secretariat,                         roles: ROLE_SECRETARIAT }

        # Comptabilité
        - { path: ^/api/comptabilite,                        roles: ROLE_COMPTABILITE }

        # Surveillant
        - { path: ^/api/surveillant,                         roles: ROLE_SURVEILLANT }

        # Enseignant
        - { path: ^/api/teacher,                             roles: ROLE_TEACHER }

        # Étudiant
        - { path: ^/api/student,                             roles: ROLE_STUDENT }

        # Parent
        - { path: ^/api/parent,                             roles: ROLE_PARENT }

        # Toute route /api non couverte = authentifié
        - { path: ^/api,                                     roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_SUPER_ADMIN_PLATEFORME:
            - ROLE_SUPER_ADMIN
            - ROLE_ADMIN
            - ROLE_DIRECTEUR
            - ROLE_DIRECTEUR_ADJOINT
            - ROLE_SERVICE_PEDAGOGIQUE
            - ROLE_CPE
            - ROLE_SECRETARIAT
            - ROLE_COMPTABILITE
            - ROLE_SURVEILLANT
            - ROLE_TEACHER
            - ROLE_STUDENT
            - ROLE_PARENT
        ROLE_SUPER_ADMIN:
            - ROLE_ADMIN
            - ROLE_DIRECTEUR
            - ROLE_DIRECTEUR_ADJOINT
            - ROLE_SERVICE_PEDAGOGIQUE
            - ROLE_CPE
            - ROLE_SECRETARIAT
            - ROLE_COMPTABILITE
            - ROLE_SURVEILLANT
            - ROLE_TEACHER
            - ROLE_STUDENT
            - ROLE_PARENT
        ROLE_ADMIN:
            - ROLE_DIRECTEUR
        ROLE_DIRECTEUR:
            - ROLE_DIRECTEUR_ADJOINT
        ROLE_DIRECTEUR_ADJOINT:
            - ROLE_SERVICE_PEDAGOGIQUE
            - ROLE_CPE
            - ROLE_SECRETARIAT