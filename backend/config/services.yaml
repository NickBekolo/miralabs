parameters:
    app.frontend_url: '%env(default:http\://localhost\:5173:FRONTEND_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\PasswordResetService:
        arguments:
            $frontendUrl: '%app.frontend_url%'
